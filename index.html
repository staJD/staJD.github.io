<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StajPilot Firmware Flasher</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #12151d;
      --border: #232838;
      --text: #e8ebf2;
      --text-dim: #8891a5;
      --accent: #4f8cff;
      --accent-dim: #2a4a8a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }
    .version {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin: 0 0 28px;
    }
    esp-web-install-button {
      display: block;
    }
    esp-web-install-button button {
      width: 100%;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    esp-web-install-button button:hover {
      background: #3f78e8;
    }
    .req {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .req code {
      background: var(--accent-dim);
      color: var(--text);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.85em;
    }
    .unsupported {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #3a1f1f;
      color: #ffb4b4;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>StajPilot</h1>
    <p class="version">Firmware v0.95 &middot; ESP32-P4</p>

    <esp-web-install-button manifest="manifest.json">
      <button slot="activate">Connect &amp; Flash</button>
      <span slot="unsupported" class="unsupported" style="display:block;">
        Your browser doesn't support Web Serial. Please use Chrome or Edge on desktop.
      </span>
      <span slot="not-allowed" class="unsupported" style="display:block;">
        This page must be served over HTTPS to flash.
      </span>
    </esp-web-install-button>

    <p class="req">
      Connect the board via USB, click the button above, and pick its serial port.
      Works in <code>Chrome</code> or <code>Edge</code> on desktop only.
    </p>
  </div>
</body>
</html>
