<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StajPilot Firmware Flasher</title>
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
<script src="devices.js"></script>
<style>
  :root {
    --bg: #0c0d10;
    --surface: #16181d;
    --surface-2: #1e2127;
    --border: #2a2d35;
    --text: #eceef2;
    --text-dim: #8a8f9c;
    --text-faint: #5c6070;
    --accent: #e8973a;
    --accent-hover: #f5a94d;
    --accent-text: #1a1408;
    --ok: #4caf6b;
    --warn: #d9863a;
    --mono: "SF Mono", "Roboto Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    line-height: 1.5;
    padding: 48px 20px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 40px; }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  header p {
    color: var(--text-dim);
    font-size: 0.95rem;
    margin: 8px 0 0;
  }

  .lang-toggle {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
    margin-bottom: 16px;
  }
  .lang-toggle button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.75rem;
    font-weight: 600;
    font-family: inherit;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
  }
  .lang-toggle button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  .picker {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .device-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  .device-btn:hover { border-color: #3a3e48; }
  .device-btn.active {
    border-color: var(--accent);
    background: #201a10;
  }
  .device-btn.unavailable {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .device-btn .name { font-weight: 600; font-size: 0.95rem; }
  .device-btn .sub { color: var(--text-dim); font-size: 0.8rem; margin-top: 2px; }
  .device-btn .badge {
    display: inline-block;
    margin-top: 8px;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--surface-2);
    color: var(--text-faint);
  }
  .device-btn.active .badge { background: var(--accent); color: var(--accent-text); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .card-header {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-header h2 { margin: 0; font-size: 1.15rem; }
  .card-header .ver {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text-dim);
    background: var(--surface-2);
    padding: 3px 10px;
    border-radius: 6px;
  }

  .steps { padding: 24px 28px; }
  .steps ol { margin: 0; padding: 0; list-style: none; counter-reset: step; }
  .steps li {
    counter-increment: step;
    display: flex;
    gap: 14px;
    padding: 10px 0;
  }
  .steps li::before {
    content: counter(step);
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 0.75rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .steps li span { padding-top: 2px; font-size: 0.92rem; }
  .steps code {
    font-family: var(--mono);
    background: var(--surface-2);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.88em;
  }
  .step-images {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .step-images figure {
    margin: 0;
    flex: 1 1 140px;
    max-width: 220px;
  }
  .step-images img {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
  }
  .step-images figcaption {
    font-size: 0.72rem;
    color: var(--text-faint);
    text-align: center;
    margin-top: 4px;
  }

  .flash-area { padding: 8px 28px 28px; }
  esp-web-install-button { display: block; }
  esp-web-install-button button {
    width: 100%;
    padding: 15px 20px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    transition: background 0.15s;
  }
  esp-web-install-button button:hover { background: var(--accent-hover); }
  esp-web-install-button button:disabled { opacity: 0.5; cursor: not-allowed; }

  .soon-box {
    padding: 28px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .msg {
    display: none;
    margin: 0 28px 24px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1.5;
  }
  .msg.warn { background: #2a1d10; color: #f0b169; border: 1px solid #4a3418; }

  .donate {
    margin-top: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
    text-align: center;
  }
  .donate h3 {
    margin: 0 0 8px;
    font-size: 1.05rem;
  }
  .donate p {
    margin: 0 0 18px;
    color: var(--text-dim);
    font-size: 0.88rem;
    line-height: 1.6;
  }
  .donate a.btn {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
    font-size: 0.92rem;
    text-decoration: none;
    padding: 12px 28px;
    border-radius: 10px;
    transition: background 0.15s;
  }
  .donate a.btn:hover { background: var(--accent-hover); }
  .donate-about {
    margin: 14px 0 0 !important;
    color: var(--text-faint) !important;
    font-size: 0.75rem !important;
    line-height: 1.5;
  }

  .faq {
    margin-top: 32px;
  }
  .faq h3 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    margin: 0 0 14px;
  }
  details {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  summary {
    padding: 14px 18px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    list-style: none;
    display: flex;
    justify-content: space-between;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--text-faint); font-weight: 400; }
  details[open] summary::after { content: "\2212"; }
  details p {
    margin: 0;
    padding: 0 18px 16px;
    color: var(--text-dim);
    font-size: 0.88rem;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    color: var(--text-faint);
    font-size: 0.8rem;
  }
  footer a { color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">

  <div class="lang-toggle" id="langToggle">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="ko">한국어</button>
  </div>

  <header>
    <div class="logo"><span class="dot"></span>StajPilot</div>
    <p id="headerSubtitle"></p>
  </header>

  <div class="picker" id="picker"></div>

  <div class="card" id="card">
    <div class="card-header">
      <h2 id="deviceName">&nbsp;</h2>
      <span class="ver" id="deviceVersion"></span>
    </div>

    <div id="readySection">
      <div class="steps">
        <ol id="stepList"></ol>
      </div>
      <div class="msg warn" id="warnUnsupported"></div>
      <div class="flash-area">
        <esp-web-install-button id="installBtn">
          <button slot="activate" id="installBtnLabel">Connect &amp; Flash</button>
          <span slot="unsupported"></span>
          <span slot="not-allowed"></span>
        </esp-web-install-button>
      </div>
    </div>

    <div class="soon-box" id="soonSection" style="display:none;"></div>
  </div>

  <div class="donate">
    <h3 id="donateHeading"></h3>
    <p id="donateText"></p>
    <a class="btn" id="donateBtn" href="https://ko-fi.com/stajd" target="_blank" rel="noopener"></a>
    <p id="donateAbout" class="donate-about"></p>
  </div>

  <div class="faq">
    <h3 id="faqHeading"></h3>
    <div id="faqList"></div>
  </div>

  <footer>
    <a href="https://github.com/staJD" target="_blank" rel="noopener">github.com/staJD</a>
  </footer>

</div>

<script>
(function () {
  const STRINGS = {
    en: {
      subtitle: "Flash your controller straight from the browser — no software to install.",
      comingSoonBadge: "coming soon",
      comingSoonBox: "Firmware for this board isn't published yet — check back soon.",
      installBtnLabel: "Connect &amp; Flash",
      unsupportedWarning:
        "This browser can't flash over USB. Open this page in <strong>Chrome</strong> or " +
        "<strong>Edge</strong> on a desktop computer (phones and Safari aren't supported).",
      imageCaptions: {
        buttons: "BOOT / RESET buttons",
        ports: "PC vs Kemper ports"
      },
      donateHeading: "Support StajPilot",
      donateText:
        "Keeping up with Kemper updates, building new boards, adding fun features — " +
        "StajPilot needs continued work to keep growing. Support is what drives that " +
        "forward. I'll keep taking on creative projects that musicians actually need.",
      donateBtn: "☕ Support on Ko-fi",
      donateAbout:
        "The name comes from \"coffee\" — the idea of buying someone a coffee as a small, " +
        "casual way to say thanks. It's a well-known creator-support platform (since 2011), " +
        "no account needed, just a card or PayPal, and completely separate from " +
        "installing/using StajPilot.",
      faqHeading: "Questions",
      faq: [
        {
          q: "My computer doesn't see the device",
          a: "Try a different USB cable — some cables are charge-only and can't carry data. " +
             "Also try a different USB port directly on your computer rather than through a hub."
        },
        {
          q: "The flash failed partway through",
          a: "Unplug the board, plug it back in, and try again from the start. Don't disconnect " +
             "the cable while a flash is in progress."
        },
        {
          q: "Is my data sent anywhere?",
          a: "No. Flashing happens directly between your browser and the board over USB — " +
             "the firmware file never leaves your computer except to download it from this page."
        }
      ],
      steps: {
        bootMode: function (cable, singlePort) {
          const portPhrase = singlePort
            ? "into the board's USB-C port"
            : "into the <strong>top</strong> USB-C port (labeled PC in the photo below)";
          return "Press and hold the board's <strong>BOOT</strong> button first, then, while " +
            "still holding it, plug in the " + cable + " " + portPhrase + ". Keep holding BOOT for about 2 more seconds, <strong>then " +
            "release it</strong>. If the screen is still <strong>blank/black 5 seconds " +
            "later</strong>, that's the sign it worked and the board is in upload mode. " +
            "(Sometimes the normal display takes a couple seconds to reappear after you let " +
            "go — if it comes back within those 5 seconds, it didn't work; try again.)";
        },
        plugIn: function (cable) {
          return "Plug the board into this computer with a " + cable + ".";
        },
        connectFlash: "Click <strong>Connect &amp; Flash</strong> below.",
        portPick:
          "A popup will list every port on your computer — pick the one for " +
          "<em>this board</em>, then click <strong>Connect</strong>." +
          "<br><strong>On Mac:</strong> look for a single entry whose name includes both " +
          "<code>usbmodem</code> and <code>USB JTAG/serial debug unit</code> together, like " +
          "<code>cu.usbmodem83101 USB JTAG/serial debug unit</code>. Ignore " +
          "<code>Bluetooth-Incoming-Port</code> or <code>debug-console</code> — those aren't your board." +
          "<br><strong>On Windows:</strong> ports just show as <code>COM3</code>, <code>COM4</code>, " +
          "etc. with no descriptive name. If you're not sure which one, unplug the board, check " +
          "which port disappears from the list, then plug it back in and pick that one.",
        eraseDialog:
          "Click <strong>Install</strong>. A dialog will ask if you want to " +
          "<strong>erase the device</strong>." +
          "<br><strong>First time installing on this board?</strong> Check the box — there's " +
          "nothing saved yet to lose, and it guarantees a clean start." +
          "<br><strong>Already have StajPilot and just updating?</strong> Leave it " +
          "<strong>unchecked</strong> to keep your saved settings and song list. " +
          "Then click <strong>Next</strong>.",
        waitFlash: "Wait for it to flash — don't unplug the board while it's in progress.",
        installComplete:
          "When you see <strong>\"Installation complete!\"</strong>, click <strong>Next</strong> " +
          "(it's the only button there). This takes you to a menu with <strong>\"Install...\"</strong> " +
          "and <strong>\"Logs &amp; Console\"</strong> — that's just the tool's normal menu " +
          "(it looks the same whether you're starting or already finished), so don't click " +
          "either option. Close it with the <strong>X</strong> in the corner instead.",
        restart: function (singlePort) {
          const swapStep = singlePort
            ? "Unplug the cable from your computer, then connect it to your Kemper as normal " +
              "— this board only has one USB-C port, so the same cable and port you used for " +
              "flashing is what connects to the Kemper."
            : "Unplug the cable from the <strong>top (PC)</strong> port, then connect the " +
              "<strong>bottom (Kemper)</strong> port to your Kemper as normal — that's how you " +
              "start running the new firmware.";
          return swapStep +
            "<br><strong>The first time it connects to your Kemper, the screen can take about " +
            "2 minutes to turn on.</strong> That's normal — the board is loading its startup " +
            "data. Don't unplug it or worry if the screen stays blank for a bit; just wait.";
        }
      }
    },
    ko: {
      subtitle: "브라우저에서 바로 컨트롤러에 펌웨어를 설치하세요 — 별도 소프트웨어 필요 없음.",
      comingSoonBadge: "출시 예정",
      comingSoonBox: "이 보드용 펌웨어는 아직 공개되지 않았습니다 — 나중에 다시 확인해주세요.",
      installBtnLabel: "연결 &amp; 플래시",
      unsupportedWarning:
        "이 브라우저는 USB로 플래싱할 수 없습니다. 데스크톱 컴퓨터의 <strong>Chrome</strong> 또는 " +
        "<strong>Edge</strong>에서 이 페이지를 열어주세요 (휴대폰과 Safari는 지원되지 않습니다).",
      imageCaptions: {
        buttons: "BOOT / RESET 버튼",
        ports: "PC용 포트 vs 캠퍼용 포트"
      },
      donateHeading: "StajPilot 후원하기",
      donateText:
        "캠퍼 업데이트 대응, 신규 보드 개발, 재미있는 기능 추가까지 — StajPilot이 " +
        "계속 발전하려면 꾸준한 관리가 필요합니다. 후원은 그 원동력이 됩니다. " +
        "앞으로도 음악인들에게 필요한 창의적인 프로젝트에 계속 도전해보겠습니다.",
      donateBtn: "☕ Ko-fi에서 후원하기",
      donateAbout:
        "이름은 '코피'처럼 들리지만 실제로는 'coffee'에서 따온 거예요 — 커피 한 잔 " +
        "사주는 느낌으로 가볍게 감사를 전한다는 컨셉의, 2011년부터 있어온 잘 알려진 " +
        "크리에이터 후원 플랫폼입니다. 별도 계정 없이 카드나 PayPal로 바로 후원할 " +
        "수 있고, StajPilot 설치·사용과는 무관합니다.",
      faqHeading: "자주 묻는 질문",
      faq: [
        {
          q: "컴퓨터가 기기를 인식하지 못해요",
          a: "다른 USB 케이블을 시도해보세요 — 일부 케이블은 충전 전용이라 데이터 전송이 안됩니다. " +
             "허브를 거치지 말고 컴퓨터의 다른 USB 포트에 직접 연결해보세요."
        },
        {
          q: "플래싱이 중간에 실패했어요",
          a: "보드를 뽑았다가 다시 꽂고 처음부터 다시 시도하세요. 플래싱이 진행 중일 때는 " +
             "케이블을 뽑지 마세요."
        },
        {
          q: "제 데이터가 어디로든 전송되나요?",
          a: "아니요. 플래싱은 브라우저와 보드 사이에서 USB로 직접 이루어집니다 — " +
             "펌웨어 파일은 이 페이지에서 다운로드되는 것 외에는 컴퓨터 밖으로 나가지 않습니다."
        }
      ],
      steps: {
        bootMode: function (cable, singlePort) {
          const portPhrase = singlePort
            ? "보드의 USB-C 포트에"
            : "<strong>위쪽</strong> USB-C 포트(아래 사진에서 PC라고 표시됨)에";
          return "보드의 <strong>BOOT</strong> 버튼을 먼저 누르고, 누른 상태에서 " +

            "연결하세요. 그 상태로 2초 정도 더 " +
            "누르고 있다가 <strong>손을 떼세요</strong>. 손을 뗀 후 <strong>5초가 지나도</strong> " +

            "모드로 들어갔다는 뜻입니다. (손을 뗀 후 몇 초 있다가 평소 화면이 뜨는 경우도 " +
            "있는데, 그 5초 안에 다시 보인다면 실패한 것이니 처음부터 다시 시도하세요.)";
        },
        plugIn: function (cable) {
          return cable + "로 보드를 이 컴퓨터에 연결하세요.";
        },
        connectFlash: "아래 <strong>연결 &amp; 플래시</strong> 버튼을 클릭하세요.",
        portPick:
          "팝업창에 컴퓨터의 모든 포트가 나열됩니다 — <em>이 보드</em>에 해당하는 " +
          "포트를 선택하고 <strong>Connect</strong>를 클릭하세요." +
          "<br><strong>Mac에서는:</strong> <code>usbmodem</code>과 <code>USB JTAG/serial debug unit</code>이 " +
          "함께 포함된 항목 하나를 찾으세요 — 예를 들면 " +
          "<code>cu.usbmodem83101 USB JTAG/serial debug unit</code> 이렇게요. " +
          "<code>Bluetooth-Incoming-Port</code>나 <code>debug-console</code>은 무시하세요 — " +
          "보드가 아닙니다." +
          "<br><strong>Windows에서는:</strong> 포트가 설명 없이 그냥 <code>COM3</code>, <code>COM4</code> 등으로 " +
          "표시됩니다. 어떤 것인지 확실하지 않다면, 보드를 뽑아서 목록에서 " +

        eraseDialog:
          "<strong>Install</strong>을 클릭하세요. 기기를 <strong>지울지(erase)</strong> 묻는 창이 " +

          "<br><strong>이 보드에 처음 설치하시나요?</strong> 체크하세요 — 아직 저장된 게 " +

          "<br><strong>이미 StajPilot을 쓰고 있고 업데이트만 하시나요?</strong> " +
          "<strong>체크하지 않은 상태</strong>로 두세요 — 그래야 저장된 설정과 곡 " +
          "목록이 유지됩니다. 그다음 <strong>Next</strong>를 클릭하세요.",
        waitFlash: "플래싱이 끝날 때까지 기다리세요 — 진행 중에는 보드를 뽑지 마세요.",
        installComplete:
          "<strong>\"Installation complete!\"</strong>가 뜨면 <strong>Next</strong>를 클릭하세요 " +
          "(버튼이 그것뿐입니다). 그러면 <strong>\"Install...\"</strong>과 " +
          "<strong>\"Logs &amp; Console\"</strong>이 있는 메뉴로 넘어가는데, 이건 처음 시작할 " +
          "때와 똑같이 생긴 이 도구의 기본 메뉴일 뿐이에요 — 아무것도 누르지 마시고, " +
          "모서리의 <strong>X</strong>로 닫으시면 됩니다.",
        restart: function (singlePort) {
          const swapStep = singlePort
            ? "컴퓨터에서 케이블을 뽑고, 캠퍼에 평소처럼 연결하세요 — 이 보드는 USB-C " +
              "포트가 하나뿐이라, 플래싱에 쓴 케이블과 포트를 그대로 캠퍼 연결에도 " +
              "사용합니다."
            : "<strong>위쪽(PC)</strong> 포트에서 케이블을 뽑고, <strong>아래쪽(캠퍼)</strong> " +
              "포트를 평소처럼 캠퍼에 연결하세요 — 그러면 새 펌웨어로 실행이 시작됩니다.";
          return swapStep +
            "<br><strong>캠퍼에 처음 연결하면 화면이 켜지기까지 약 2분 정도 걸릴 수 있습니다.</strong> " +
            "정상적인 동작입니다(보드가 시작 데이터를 불러오는 중입니다). 화면이 잠시 꺼져 있어도 " +
            "초조해하지 마시고 그대로 기다려주세요.";
        }
      }
    }
  };

  const devices = window.STAJPILOT_DEVICES || [];
  const picker = document.getElementById("picker");
  const deviceName = document.getElementById("deviceName");
  const deviceVersion = document.getElementById("deviceVersion");
  const stepList = document.getElementById("stepList");
  const installBtn = document.getElementById("installBtn");
  const installBtnLabel = document.getElementById("installBtnLabel");
  const readySection = document.getElementById("readySection");
  const soonSection = document.getElementById("soonSection");
  const headerSubtitle = document.getElementById("headerSubtitle");
  const warnUnsupported = document.getElementById("warnUnsupported");
  const faqHeading = document.getElementById("faqHeading");
  const faqList = document.getElementById("faqList");
  const langToggle = document.getElementById("langToggle");
  const donateHeading = document.getElementById("donateHeading");
  const donateText = document.getElementById("donateText");
  const donateBtn = document.getElementById("donateBtn");
  const donateAbout = document.getElementById("donateAbout");

  let currentLang = localStorage.getItem("stajpilot-lang");
  if (currentLang !== "en" && currentLang !== "ko") {
    currentLang = (navigator.language || "").toLowerCase().indexOf("ko") === 0 ? "ko" : "en";
  }
  let activeDevice = null;

  function t() { return STRINGS[currentLang]; }

  function imageBlockFor(device) {
    if (!device.images) return "";
    const cap = t().imageCaptions || {};
    const figs = Object.keys(device.images).map(function (key) {
      return '<figure><img src="' + device.images[key] + '" alt="' + (cap[key] || key) + '">' +
        '<figcaption>' + (cap[key] || key) + '</figcaption></figure>';
    }).join("");
    return '<div class="step-images">' + figs + '</div>';
  }

  function stepsFor(device) {
    const s = t().steps;
    const steps = [];
    const cable = (currentLang === "ko" && device.cableKo) ? device.cableKo : device.cable;

    if (device.needsBootMode) {
      steps.push(s.bootMode(cable, device.singlePort) + imageBlockFor(device));
    } else {
      steps.push(s.plugIn(cable) + imageBlockFor(device));
    }

    steps.push(s.connectFlash);
    steps.push(s.portPick);
    steps.push(s.eraseDialog);
    steps.push(s.waitFlash);
    steps.push(s.installComplete);
    steps.push(s.restart(device.singlePort));

    return steps.concat(device.notes || []);
  }

  function renderStatic() {
    document.documentElement.lang = currentLang;
    headerSubtitle.innerHTML = t().subtitle;
    installBtnLabel.innerHTML = t().installBtnLabel;
    warnUnsupported.innerHTML = t().unsupportedWarning;
    faqHeading.textContent = t().faqHeading;
    faqList.innerHTML = t().faq.map(function (item) {
      return "<details><summary>" + item.q + "</summary><p>" + item.a + "</p></details>";
    }).join("");
    donateHeading.textContent = t().donateHeading;
    donateText.textContent = t().donateText;
    donateBtn.textContent = t().donateBtn;
    donateAbout.textContent = t().donateAbout;
    langToggle.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-lang") === currentLang);
    });
  }

  function render(device) {
    activeDevice = device;
    deviceName.textContent = device.name + (device.subtitle ? " — " + device.subtitle : "");
    deviceVersion.textContent = device.available ? device.version : t().comingSoonBadge;

    if (!device.available) {
      readySection.style.display = "none";
      soonSection.style.display = "block";
      soonSection.textContent = t().comingSoonBox;
      return;
    }
    readySection.style.display = "block";
    soonSection.style.display = "none";

    stepList.innerHTML = stepsFor(device).map(function (s) {
      return "<li><span>" + s + "</span></li>";
    }).join("");

    installBtn.setAttribute("manifest", device.manifest);
  }

  function deviceFromHash() {
    const id = (location.hash || "").replace(/^#/, "");
    if (!id) return null;
    return devices.find(function (d) { return d.id === id; }) || null;
  }

  function buildPicker() {
    picker.innerHTML = "";
    devices.forEach(function (device) {
      const btn = document.createElement("button");
      btn.className = "device-btn" + (device === activeDevice ? " active" : "") + (device.available ? "" : " unavailable");
      btn.innerHTML =
        '<div class="name">' + device.name + "</div>" +
        '<div class="sub">' + device.subtitle + "</div>" +
        '<div class="badge">' + (device.available ? device.version : t().comingSoonBadge) + "</div>";
      btn.addEventListener("click", function () {
        if (!device.available) return;
        picker.querySelectorAll(".device-btn").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        history.replaceState(null, "", "#" + device.id);
        render(device);
      });
      picker.appendChild(btn);
    });
  }

  function renderAll() {
    if (!activeDevice) {
      activeDevice = deviceFromHash() || devices[0];
    }
    renderStatic();
    buildPicker();
    render(activeDevice);
  }

  langToggle.querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      currentLang = b.getAttribute("data-lang");
      localStorage.setItem("stajpilot-lang", currentLang);
      renderAll();
    });
  });

  window.addEventListener("hashchange", function () {
    const d = deviceFromHash();
    if (d) {
      activeDevice = d;
      buildPicker();
      render(activeDevice);
    }
  });

  if (devices.length) renderAll();
})();
</script>
</body>
</html>
